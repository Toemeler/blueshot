# Push to main -> unsigned IPA as release build-N -> SideStore source committed
# to main, which GitHub Pages serves (Settings > Pages: main, / root).
name: Build

on:
  push:
    branches: [main]
    paths: [App/**, Broadcast/**, project.yml, .github/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: 1.0.${{ github.run_number }}
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          brew install xcodegen
          xcodegen generate
          xcodebuild -project BlueShot.xcodeproj -target BlueShot -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO build | tail -30

      - name: Package
        run: |
          set -euo pipefail
          APP=build/Release-iphoneos/BlueShot.app
          ls "$APP/PlugIns"
          # Ad-hoc sign; SideStore re-signs with your Apple ID on install.
          codesign --force --sign - "$APP/PlugIns/Broadcast.appex"
          codesign --force --sign - "$APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr BlueShot.ipa Payload
          echo "SIZE=$(stat -f%z BlueShot.ipa)" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" BlueShot.ipa --title "BlueShot $VERSION" \
            --notes "Unsigned build; install with SideStore: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Update SideStore source
        run: |
          set -euo pipefail
          python3 .github/scripts/make_source.py
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add s.json index.html
          git commit -m "Source for $TAG" || exit 0
          git pull --rebase && git push
